services:
  testrunner:
    image: $DEV_IMAGE_TAG
    build:
      dockerfile: Dockerfile.dev
      context: .
      args:
        OTP_VERSION: $OTP_VERSION
        THRIFT_VERSION: $THRIFT_VERSION
        USER_UID: $USER_UID
        USER_GID: $USER_GID
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    volumes:
      - .:$PWD
    hostname: threat_detector
    working_dir: $PWD
    command: /sbin/init
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: threat_detector
      POSTGRES_USER: threat_detector
      POSTGRES_PASSWORD: threat_detector
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_detector -d threat_detector"]
      interval: 5s
      timeout: 5s
      retries: 10
